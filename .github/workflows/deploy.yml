name: CD (ssh-agent)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection (verbose)
        run: ssh -o StrictHostKeyChecking=no -vvv -p 2452 vboxuser@course.prafdin.ru 'echo OK; uname -a'

      - name: Deploy Docker container from GHCR
        run: |
          ssh -o StrictHostKeyChecking=no -p 2452 vboxuser@course.prafdin.ru '
            set -euxo pipefail

            APP_DIR=/home/vboxuser/Desktop/DevOps/catty-reminders-app
            CONTAINER_NAME=catty-reminders
            IMAGE_NAME=ghcr.io/<USERNAME>/catty-reminders-app:latest

            echo $GHCR_PAT | docker login ghcr.io -u <USERNAME> --password-stdin

            if docker ps -a --format "{{.Names}}" | grep -Eq "^${CONTAINER_NAME}$"; then
              docker stop ${CONTAINER_NAME}
              docker rm ${CONTAINER_NAME}
            fi

            docker run -d \
              --name ${CONTAINER_NAME} \
              -p 80:80 \
              -e APP_ENV=production \
              ${IMAGE_NAME}

            docker ps | grep ${CONTAINER_NAME}

            for i in $(seq 1 20); do
              if curl -s http://app.$ID.$PROXY/ >/dev/null; then
                echo "App is reachable"
                exit 0
              fi
              sleep 1
            done
            echo "App is not reachable" >&2
            exit 1
          '