name: CD - Deploy Docker Container

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]


jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LOWER=${OWNER_LOWER}" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/${OWNER_LOWER}/catty-reminders-app:latest" >> $GITHUB_ENV
          echo "CONTAINER_NAME=catty-reminders" >> $GITHUB_ENV
          echo "APP_DIR=/home/vboxuser/Desktop/DevOps/catty-reminders-app" >> $GITHUB_ENV

      - name: Deploy Docker container on server
        run: |
          ssh -o StrictHostKeyChecking=no -p 2452 vboxuser@course.prafdin.ru \
          "GHCR_PAT='${GHCR_PAT}' IMAGE_NAME='${IMAGE_NAME}' CONTAINER_NAME='${CONTAINER_NAME}' bash -c '
            set -euxo pipefail

            echo \"Logging in to GHCR\"
            echo \"\$GHCR_PAT\" | docker login ghcr.io -u ${OWNER_LOWER} --password-stdin

            # Остановка и удаление старого контейнера
            if docker ps -a --format \"{{.Names}}\" | grep -Eq \"^${CONTAINER_NAME}$\"; then
              docker stop \"\${CONTAINER_NAME}\"
              docker rm \"\${CONTAINER_NAME}\"
            fi

            # Запуск нового контейнера
            docker run -d --name \"\${CONTAINER_NAME}\" -p 80:80 -e APP_ENV=production \"\${IMAGE_NAME}\"

            # Проверка доступности приложения через прокси
            for i in \$(seq 1 20); do
              if curl -s http://app.\$ID.\$PROXY/ >/dev/null; then
                echo \"App is reachable\"
                exit 0
              fi
              sleep 1
            done

            echo \"App is not reachable\" >&2
            exit 1
          '"