name: CI - build & test & push image

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/catty-reminders-app
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Если у вас есть Playwright UI-тесты — ставим браузеры (выполняется всегда)
      - name: Install Playwright browsers
        uses: microsoft/playwright-action@v1
        with:
          install-deps: true

      - name: Start app (uvicorn) in background for integration tests
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8181 > uvicorn.log 2>&1 &
        # при необходимости замените app:app на ваш модуль/приложение

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8181/ >/dev/null; then
              echo "app ready"
              exit 0
            fi
            sleep 1
          done
          echo "app did not start" >&2
          cat uvicorn.log || true
          exit 1

      - name: Run tests
        run: |
          pytest -q

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Lint Dockerfile (hadolint)
        uses: ludeeus/hadolint-action@v1
        continue-on-error: true