name: CI - build & test & push image

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    # добавляем сервис БД
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: cattydb
          MYSQL_USER: catty
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create lowercase IMAGE_NAME and set IMAGE_TAG
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${OWNER_LOWER}/catty-reminders-app" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create venv & install python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      # Экспортируем переменные БД в окружение job'а, чтобы приложение их подхватило
      - name: Export DB env for app/tests
        run: |
          echo "MYSQL_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "MYSQL_PORT=3306" >> $GITHUB_ENV
          echo "MYSQL_USER=catty" >> $GITHUB_ENV
          echo "MYSQL_PASSWORD=secret" >> $GITHUB_ENV
          echo "MYSQL_DATABASE=cattydb" >> $GITHUB_ENV

      - name: Wait for MariaDB to become available (python check)
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import os, time, sys
          import mysql.connector
          host=os.getenv("MYSQL_HOST","127.0.0.1")
          port=int(os.getenv("MYSQL_PORT","3306"))
          user=os.getenv("MYSQL_USER","catty")
          password=os.getenv("MYSQL_PASSWORD","secret")
          db=os.getenv("MYSQL_DATABASE","cattydb")
          for i in range(40):
          try:
              conn = mysql.connector.connect(host=host, port=port, user=user, password=password, database=db)
              conn.close()
              print("MariaDB available")
              sys.exit(0)
          except Exception as e:
              print("waiting for db...", i, str(e))
              time.sleep(2)
              print("DB did not become ready", file=sys.stderr)
              sys.exit(1)
              PY

      - name: Start app (uvicorn) in background for integration tests
        run: |
          source .venv/bin/activate
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 > uvicorn.log 2>&1 &
      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8181/ >/dev/null; then
              echo "app ready"
              exit 0
            fi
            sleep 1
          done
          echo "app did not start" >&2
          cat uvicorn.log || true
          exit 1

      - name: Run tests
        env:
          BASE_URL: http://127.0.0.1:8181
          PYTHONPATH: ${{ github.workspace }}
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: catty
          MYSQL_PASSWORD: secret
          MYSQL_DATABASE: cattydb
        run: |
          source .venv/bin/activate
          pytest -q

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Lint Dockerfile (hadolint via docker)
        continue-on-error: true
        run: docker run --rm -i hadolint/hadolint:latest < Dockerfile