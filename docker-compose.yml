x-common-labels: &common_labels
  project: catty-reminders
  managed-by: github-actions

services:
  web:
    image: ghcr.io/quyntrd/catty-reminders-app:${IMAGE_TAG:-latest}
    container_name: catty-reminders
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - APP_ENV=${APP_ENV:-production}

      # Primary MySQL vars (most apps)
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-catty}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cattypass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cattydb}

      # Common alternative names / aliases — на случай, если код ждёт эти переменные
      - DB_HOST=${MYSQL_HOST:-mysql}
      - DB_PORT=${MYSQL_PORT:-3306}
      - DB_USER=${MYSQL_USER:-catty}
      - DB_PASSWORD=${MYSQL_PASSWORD:-cattypass}
      - DB_NAME=${MYSQL_DATABASE:-cattydb}
      - DATABASE_HOST=${MYSQL_HOST:-mysql}
      - DATABASE_PORT=${MYSQL_PORT:-3306}
      - DATABASE_USER=${MYSQL_USER:-catty}
      - DATABASE_PASSWORD=${MYSQL_PASSWORD:-cattypass}
      - DATABASE_NAME=${MYSQL_DATABASE:-cattydb}

      # Оставьте DATABASE_URL пустым или используйте, если нужно одновременно и Postgres (удалено в этом файле)
      # - DATABASE_URL=${DATABASE_URL:-}

    ports:
      - "${HOST_PORT:-8181}:${CONTAINER_PORT:-8181}"
    labels:
      <<: *common_labels
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${CONTAINER_PORT:-8181}/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - appnet

  mysql:
    image: mysql:8.0
    container_name: catty-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cattydb}
      - MYSQL_USER=${MYSQL_USER:-catty}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cattypass}
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - appnet

volumes:
  mysql-data:
    name: catty_mysql_data

networks:
  appnet:
    name: catty_app_net