# docker-compose.yml
x-common-labels: &common_labels
  project: catty-reminders
  managed-by: github-actions

services:
  web:
    image: ghcr.io/quyntrd/catty-reminders-app:${IMAGE_TAG:-latest}
    container_name: catty-reminders
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - mysql
    environment:
      - APP_ENV=${APP_ENV:-production}

      - MYSQL_HOST=${MYSQL_HOST:-127.0.0.1}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mypass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-catty_reminders}

    volumes:
      - ./config.json:/srv/app/config.json:ro

    labels:
      <<: *common_labels

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8181/"]
      interval: 30s
      timeout: 3s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: catty-mysql
    restart: unless-stopped
    network_mode: "host"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-mypass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-catty_reminders}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mypass}
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    labels:
      <<: *common_labels
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql-data:
    name: catty_mysql_data